services:
  webhook-to-napcat:
    image: ghcr.io/etoile-7/webhook-to-napcat:latest
    container_name: webhook-to-napcat
    pull_policy: always
    restart: unless-stopped
    command: ["python", "-m", "webhook_to_napcat.server"]

    # 将 webhook 服务端口暴露到宿主机
    ports:
      - "8787:8787"

    environment:
      # 容器内 webhook 服务监听地址
      LISTEN_HOST: "0.0.0.0"

      # 容器内 webhook 服务监听端口
      # 上面的 ports 会把宿主机 8787 映射到这里
      LISTEN_PORT: "8787"

      # webhook 路径，例如：http://你的主机:8787/webhook
      WEBHOOK_PATH: "/webhook"

      # 可选的 webhook 密钥；留空表示不启用校验
      WEBHOOK_SECRET: ""

      # NapCat OneBot v11 HTTP API 地址
      # 如果 NapCat 跑在宿主机上，一般保留 host.docker.internal 即可
      # 如果不是，请改成真实的主机/IP 和端口
      NAPCAT_BASE_URL: "http://host.docker.internal:3001"

      # 可选的 NapCat token；如果没开鉴权就留空
      NAPCAT_TOKEN: ""

      # token 传递方式：header 或 query
      NAPCAT_TOKEN_MODE: "header"

      # 私聊和群聊二选一；目标必须填写数字 QQ 号
      # 不填写时服务仍可启动，但没有默认转发目标
      NAPCAT_PRIVATE_QQ: ""
      NAPCAT_GROUP_QQ: ""

      # 调用 NapCat HTTP API 时的超时和重试次数
      NAPCAT_TIMEOUT: "10"
      NAPCAT_RETRIES: "5"

      # 消息日志目录（容器内），会把每次 webhook 请求/转发结果写成 JSONL
      WEBHOOK_LOG_DIR: "/app/logs"

      # base64 附件在容器内的保存目录，以及写入消息/日志里的宿主机路径前缀
      WEBHOOK_MEDIA_DIR: "/app/media"
      WEBHOOK_PUBLIC_MEDIA_DIR: "/opt/WebhookToNapcat/media"

      # 长消息拆分时，单条 QQ 消息的最大长度
      QQ_CHUNK_SIZE: "280"

      # BililiveRecorder 聚合与下播等待窗口
      WEBHOOK_AGGREGATE_WINDOW_MS: "3000"
      WEBHOOK_NOTIFY_DEBOUNCE_MS: "15000"

      # 可选：BililiveRecorder XML 弹幕统计配置
      BILILIVE_XML_BASE_DIR: "/data/zhijiang_video"
      BILILIVE_XML_STRIP_PREFIXES: "rec/"
      BILILIVE_GIFT_PRICE_TABLE: "/app/bilibili_gift_prices.md"

      # 可选：按直播房间覆盖推送目标；default 表示使用上面的默认私聊/群聊
      BILILIVE_TARGETS_JSON: '{"22632424":["default",{"group":162525281},{"group":1054553890}]}'

    volumes:
      # 将工作目录整体挂载进容器；logs / media 共用同一个目录
      - ".:/app"
      - "/data/zhijiang_video:/data/zhijiang_video:ro"

    extra_hosts:
      # 让容器可以访问宿主机上运行的服务
      - "host.docker.internal:host-gateway"
